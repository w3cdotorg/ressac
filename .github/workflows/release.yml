name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check that the tag matches the versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(awk -F'"' '/^\[workspace.package\]/ { p = 1 } p && /^version *=/ { print $2; exit }' Cargo.toml)
          app=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)
          echo "Tag $tag, Cargo $cargo, app $app."
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$app" ]; then
            echo "::error title=Version mismatch::Tag v$tag, Cargo.toml $cargo, project.yml MARKETING_VERSION $app. Bump both before tagging."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
  macos:
    name: macOS app
    needs: version
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Unlike ci.yml, a release never falls back: without Xcode 27 there is nothing to publish.
      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          required=27
          major() { xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }'; }
          if [ "$(major)" -lt "$required" ]; then
            candidate=$(find /Applications -maxdepth 1 -name "Xcode_${required}*.app" 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
            fi
          fi
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          if [ "$(major)" -lt "$required" ] || [ "${sdk%%.*}" -lt "$required" ]; then
            echo "::error title=Xcode $required missing::$(xcodebuild -version | head -n 1) with the macOS $sdk SDK; the app needs Xcode $required."
            exit 1
          fi
      # rustup directly rather than a third-party action, as in every release job.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: apps/macos
        run: xcodegen generate
      - name: Build the app
        working-directory: apps/macos
        run: xcodebuild -project Ressac.xcodeproj -scheme Ressac -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/build" ARCHS=arm64 build
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/build/Build/Products/Release/Ressac.app"
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          codesign --verify --deep "$app"
          "$app/Contents/Helpers/ressac" --version
          # ditto keeps the bundle's symlinks, extended attributes and ad-hoc signatures.
          ditto -c -k --keepParent "$app" "$out/Ressac-$VERSION-macos-arm64.zip"
          tar -czf "$out/Ressac-cli-$VERSION-macos-arm64.tar.gz" -C "$app/Contents/Helpers" ressac
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7
  linux:
    name: Linux CLI (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ubuntu 22.04 keeps the glibc floor at 2.35, so the binary runs on most distributions.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build
        run: cargo build --release --locked -p ressac
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/ressac --version
          db="$(mktemp -d)/t.sqlite"
          HOME="$(mktemp -d)" ./target/release/ressac --db "$db" --json migrate
          echo "Highest glibc symbol: $(objdump -T target/release/ressac | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)"
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          tar -czf "$RUNNER_TEMP/dist/Ressac-cli-$VERSION-linux-$ARCH.tar.gz" -C target/release ressac
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  linux-app:
    name: Linux app RPM (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    timeout-minutes: 60
    steps:
      # The checkout action needs git inside the container to make a real clone.
      - name: Install git
        run: dnf install -y git-core
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the build packages
        run: |
          # Word splitting is the point: one argument per package name.
          # shellcheck disable=SC2046
          dnf install -y $(sed 's/#.*//' apps/linux/dev/packages.txt) rpm-build desktop-file-utils
      # Cargo and rpmbuild run as a regular user; it owns the checkout and the output folder.
      - name: Create the build user
        run: |
          useradd --create-home --user-group ressac
          mkdir -p "$RUNNER_TEMP/dist"
          chown -R ressac:ressac "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dist"
      - name: Build the RPM
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: runuser -u ressac -- bash apps/linux/packaging/build-rpm.sh "$VERSION" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-app-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*.rpm
          if-no-files-found: error
          retention-days: 7
  # A fresh container, so the RPM's own dependencies are proven without the build packages.
  linux-app-verify:
    name: Linux app RPM check (${{ matrix.arch }})
    needs: [version, linux-app]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Install git
        run: dnf install -y git-core
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-app-${{ matrix.arch }}
          path: ${{ runner.temp }}/rpm
      # The script creates its own user, who reads the fixture from the checkout.
      - name: Verify the RPM
        shell: bash
        run: |
          set -euo pipefail
          chmod -R a+rX "$GITHUB_WORKSPACE"
          rpm=$(ls "$RUNNER_TEMP"/rpm/Ressac-*-linux-*.rpm)
          bash apps/linux/packaging/verify-rpm.sh "$rpm" "$GITHUB_WORKSPACE"
  publish:
    name: Publish
    needs: [version, macos, linux, linux-app-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "Ressac-$VERSION-macos-arm64.zip"
            "Ressac-cli-$VERSION-macos-arm64.tar.gz"
            "Ressac-cli-$VERSION-linux-x86_64.tar.gz"
            "Ressac-cli-$VERSION-linux-aarch64.tar.gz"
            "Ressac-$VERSION-linux-x86_64.rpm"
            "Ressac-$VERSION-linux-aarch64.rpm"
          )
          for name in "${expected[@]}"; do
            if [ ! -f "dist/$name" ]; then
              echo "::error title=Missing artifact::$name"
              exit 1
            fi
          done
          (cd dist && sha256sum ./*.zip ./*.tar.gz ./*.rpm | sed "s|  ./|  |" > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          **Unsigned build.** Ressac is signed ad hoc, not with a Developer ID, and not notarized. macOS 27 on Apple silicon only.

          - **App:** unzip `Ressac-…-macos-arm64.zip`, move `Ressac.app` to `/Applications/`, then clear the quarantine flag once: `xattr -dr com.apple.quarantine /Applications/Ressac.app` (or open it, then allow it under System Settings ▸ Privacy & Security).
          - **Terminal:** `Ressac-cli-…-macos-arm64.tar.gz` holds the same `ressac` binary the app embeds; `tar -xzf` it somewhere on your `PATH` and run `xattr -d com.apple.quarantine ressac`.
          - **Linux, KDE app and terminal (Fedora 44 or newer):** `sudo dnf install ./Ressac-…-linux-x86_64.rpm` (or `-aarch64`) installs `ressac-kde` and `ressac`. The RPM is not signed. If you installed the app with `apps/linux/install.sh`, run `apps/linux/install.sh --uninstall` first. `sudo dnf remove ressac` keeps your database and settings.
          - **Linux (terminal only):** `Ressac-cli-…-linux-x86_64.tar.gz` and `Ressac-cli-…-linux-aarch64.tar.gz` hold the `ressac` binary, built on Ubuntu 22.04 (glibc 2.35 or newer). `tar -xzf` it into a directory on your `PATH`, such as `~/.local/bin`. Links open through `xdg-open`; files live under `~/.local/share/ressac`, `~/.config/ressac` and `~/.local/state/ressac` (see the README's Linux section).
          - `SHA256SUMS` lists every archive's checksum.
          EOF
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ressac $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            $prerelease \
            dist/*.zip dist/*.tar.gz dist/*.rpm dist/SHA256SUMS
