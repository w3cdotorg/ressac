name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  macos:
    name: macOS app
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for Xcode 27 and the macOS 27 SDK
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          required=27
          major() { xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }'; }
          if [ "$(major)" -lt "$required" ]; then
            candidate=$(ls -d /Applications/Xcode_"$required"*.app 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
            fi
          fi
          xcode=$(xcodebuild -version | head -n 1) || true
          sdk=$(xcrun --sdk macosx --show-sdk-version) || true
          if [ "$(major)" -ge "$required" ] && [ "${sdk%%.*}" -ge "$required" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Using $xcode with the macOS $sdk SDK."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Xcode $required missing::This runner has $xcode with the macOS $sdk SDK; the app needs Xcode $required and the macOS $required SDK. Build and tests are skipped (spec §9, notes.md)."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.xcode.outputs.available == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.xcode.outputs.available == 'true'
      - name: Install XcodeGen
        if: steps.xcode.outputs.available == 'true'
        run: brew install xcodegen
      - name: Generate the Xcode project
        if: steps.xcode.outputs.available == 'true'
        working-directory: apps/macos
        run: xcodegen generate
      - name: Build and test the app
        if: steps.xcode.outputs.available == 'true'
        working-directory: apps/macos
        run: xcodebuild -project Ressac.xcodeproj -scheme Ressac -destination 'platform=macOS' -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" test
      - name: Check that every test ran
        if: steps.xcode.outputs.available == 'true'
        working-directory: apps/macos
        shell: bash
        run: |
          set -euo pipefail
          # One test case per @Test function, a parameterized one included (Xcode 27's count).
          declared=$(grep -rhE '^\s*(@[A-Za-z]+(\([^)]*\))?\s+)*@Test\b' RessacTests | wc -l | tr -d ' ')
          summary=$(xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TestResults.xcresult" --compact)
          total=$(jq -r '.totalTestCount' <<<"$summary")
          failed=$(jq -r '.failedTests' <<<"$summary")
          skipped=$(jq -r '.skippedTests' <<<"$summary")
          for value in "$declared" "$total" "$failed" "$skipped"; do
            if [[ ! $value =~ ^[0-9]+$ ]]; then
              echo "::error title=Test count unreadable::declared='$declared' total='$total' failed='$failed' skipped='$skipped'; xcresulttool's summary changed shape."
              exit 1
            fi
          done
          echo "RessacTests declares $declared tests; $total ran ($failed failed, $skipped skipped)."
          if [ "$total" -lt "$declared" ] || [ "$failed" -ne 0 ]; then
            echo "::error title=Tests missing::$total of the $declared tests declared in RessacTests ran, $failed failed."
            exit 1
          fi
      - name: Allowed failure, no Xcode 27 on this runner
        if: steps.xcode.outputs.available != 'true'
        continue-on-error: true
        run: |
          echo "::error title=Xcode 27 missing::The macOS app was not built or tested on this runner (allowed to fail, see notes.md)."
          exit 1
