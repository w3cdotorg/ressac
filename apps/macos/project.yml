name: Ressac
options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: org.w3cdotorg
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Ressac:
    type: application
    platform: macOS
    sources:
      - path: Ressac
        excludes:
          - "Resources/Fonts"
          - "Resources/Chart"
          - "Resources/AppIcon.svg"
      - path: Ressac/Resources/Fonts
        type: folder
        buildPhase: resources
      # The sea chart page, one folder in the bundle: the web view reads it with one file-URL grant.
      - path: Ressac/Resources/Chart
        type: folder
        buildPhase: resources
    info:
      path: build/Info.plist
      properties:
        ATSApplicationFontsPath: Fonts
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.w3cdotorg.ressac
        PRODUCT_NAME: Ressac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ressac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT licence"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    postCompileScripts:
      - name: Embed ressac helper
        path: scripts/embed-helper.sh
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ressac
    scheme:
      testTargets:
        - RessacTests
  RessacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RessacTests
    dependencies:
      - target: Ressac
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.w3cdotorg.ressac.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
